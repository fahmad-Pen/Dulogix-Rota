name: dulogix
services:
  php:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://dulogix:dulogix_local@database:3306/dulogix?serverVersion=mariadb-11.8.0&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy
  web:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: dulogix
      MARIADB_USER: dulogix
      MARIADB_PASSWORD: dulogix_local
      MARIADB_ROOT_PASSWORD: dulogix_root_local
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

volumes: {mariadb_data: {}}
