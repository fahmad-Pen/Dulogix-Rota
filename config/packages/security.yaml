security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login
    role_hierarchy:
        ROLE_ADMIN: ROLE_OPERATIONS
        ROLE_MANAGER: ROLE_OPERATIONS
    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/account$, roles: ROLE_USER }
        - { path: ^/driver/availability$, roles: ROLE_USER }
        - { path: ^/driver, roles: ROLE_DRIVER }
        - { path: ^/admin, roles: ROLE_OPERATIONS }
        - { path: ^/, roles: ROLE_OPERATIONS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
